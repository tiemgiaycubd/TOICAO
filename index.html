<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Quản Trị Tối Cao - Tiệm Giày</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Tối ưu cho Mobile: Ẩn thanh cuộn nhưng vẫn cuộn được */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Ngăn iOS auto-zoom khi focus vào input */
        input, select, textarea { font-size: 16px !important; }
        /* Loại bỏ mũi tên tăng giảm số */
        input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Padding safe area cho màn hình tai thỏ/dynamic island ở dưới */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800 font-sans">

    <!-- STICKY HEADER -->
    <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-md z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center shadow-inner">
                <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-wide leading-tight">Quản Trị Tối Cao</h1>
                <p class="text-[10px] font-medium text-indigo-200 mt-0.5">Baserow & Firebase</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="cleanUpBaserow()" class="p-2 bg-orange-500 hover:bg-orange-600 rounded-lg text-white transition flex items-center justify-center shadow-md" title="Dọn Rác (Sau 3 ngày)">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button onclick="loadAllData()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-white transition flex items-center justify-center group" title="Làm mới">
                <i data-lucide="refresh-cw" class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500"></i>
            </button>
        </div>
    </header>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed top-20 right-4 left-4 z-50 flex flex-col space-y-2 pointer-events-none items-end"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto pb-24 relative bg-slate-50 no-scrollbar p-3 space-y-4">
        
        <!-- SECTION: ĐƠN BÁN GIÀY (BASEROW) -->
        <section id="sec-mua" class="max-w-lg mx-auto space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-800 flex items-center"><i data-lucide="shopping-bag" class="w-4 h-4 mr-1.5 text-indigo-500"></i>Đơn Bán Giày</h2>
                <span class="text-[10px] bg-slate-200 text-slate-500 px-2 py-0.5 rounded-full font-bold">Baserow</span>
            </div>
            <div id="list-mua" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-sm">Đang tải dữ liệu...</div>
            </div>
        </section>

        <!-- SECTION: ĐƠN GIẶT GIÀY (BASEROW) -->
        <section id="sec-giat" class="max-w-lg mx-auto hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-800 flex items-center"><i data-lucide="droplets" class="w-4 h-4 mr-1.5 text-cyan-500"></i>Đơn Giặt Giày</h2>
                <span class="text-[10px] bg-slate-200 text-slate-500 px-2 py-0.5 rounded-full font-bold">Baserow</span>
            </div>
            <div id="list-giat" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-sm">Đang tải dữ liệu...</div>
            </div>
        </section>

        <!-- SECTION: LỢI NHUẬN (FIREBASE) -->
        <section id="sec-loinhuan" class="max-w-lg mx-auto hidden space-y-4">
            
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-bold text-slate-800 flex items-center"><i data-lucide="trending-up" class="w-4 h-4 mr-1.5 text-emerald-500"></i>Báo Cáo Lợi Nhuận</h2>
                <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">Firebase</span>
            </div>

            <!-- Tổng quan dạng lưới 2 cột cho Mobile -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Tổng Doanh Thu</p>
                    <h3 id="stat-doanhthu" class="text-base font-black text-indigo-600 truncate">0đ</h3>
                </div>
                <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Tổng Giá Vốn</p>
                    <h3 id="stat-giavon" class="text-base font-black text-rose-600 truncate">0đ</h3>
                </div>
                <div class="col-span-2 bg-emerald-500 rounded-xl p-4 shadow-md shadow-emerald-200 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-emerald-100 font-bold uppercase tracking-wider mb-1">Lợi Nhuận Thực Tế</p>
                        <h3 id="stat-loinhuan" class="text-xl font-black text-white truncate">0đ</h3>
                    </div>
                    <i data-lucide="award" class="w-8 h-8 text-white opacity-80"></i>
                </div>
            </div>

            <!-- Danh sách dạng Card (thay cho Table để dễ nhìn trên Mobile) -->
            <div class="mt-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 pl-1">Chi tiết từng đơn</h3>
                <div id="list-loinhuan" class="space-y-3">
                    <div class="text-center py-10 text-slate-400 text-sm">Đang tải dữ liệu Firebase...</div>
                </div>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR (MOBILE FIRST) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-30 pb-safe">
        <div class="flex justify-around items-center h-16 max-w-lg mx-auto px-2">
            
            <button onclick="switchTab('mua')" id="nav-mua" class="nav-btn flex flex-col items-center justify-center w-full h-full text-indigo-600">
                <i data-lucide="shopping-bag" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-bold">Bán Giày</span>
            </button>
            
            <button onclick="switchTab('giat')" id="nav-giat" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-cyan-500 transition-colors">
                <i data-lucide="droplets" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-bold">Giặt Giày</span>
            </button>
            
            <button onclick="switchTab('loinhuan')" id="nav-loinhuan" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors">
                <i data-lucide="trending-up" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-bold">Lợi Nhuận</span>
            </button>
            
        </div>
    </nav>

    <!-- IMAGE ZOOM MODAL -->
    <div id="img-modal" class="fixed inset-0 bg-slate-900/90 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeImageZoom()">
        <img id="img-modal-content" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain">
        <button class="absolute top-4 right-4 bg-white/20 p-2 rounded-full text-white hover:bg-white/40"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAWRBa3-QI8QG6kfP2J_qzgbpDz2_GJPp8",
            authDomain: "doanhthu-73ade.firebaseapp.com",
            projectId: "doanhthu-73ade",
            storageBucket: "doanhthu-73ade.firebasestorage.app",
            messagingSenderId: "449682329782",
            appId: "1:449682329782:web:94974d346a4b49f8651617"
        };
        const app = initializeApp(firebaseConfig);
        window.fbDb = getFirestore(app);
        window.fbGetDocs = getDocs;
        window.fbCollection = collection;
        window.fbDoc = doc;
        window.fbUpdateDoc = updateDoc;
    </script>

    <!-- CORE SCRIPTS -->
    <script>
        const BASEROW_TOKEN = "Qn92eA9q9e2w9e9e9e9e9e9e9e9e9e9e"; // NHỚ ĐIỀN TOKEN THẬT
        const TABLE_MUA = 437000; 
        const TABLE_GIAT = 437001; 

        let dataMua = [];
        let dataGiat = [];
        let dataDoanhThu = []; // Firebase

        window.onload = () => {
            lucide.createIcons();
            loadAllData();
        };

        // --- NAVIGATION ---
        function switchTab(tabId) {
            ['mua', 'giat', 'loinhuan'].forEach(id => {
                document.getElementById(`sec-${id}`).classList.add('hidden');
                const btn = document.getElementById(`nav-${id}`);
                btn.classList.remove('text-indigo-600', 'text-cyan-600', 'text-emerald-600');
                btn.classList.add('text-slate-400');
                
                if(id === tabId) {
                    document.getElementById(`sec-${id}`).classList.remove('hidden');
                    if (id === 'giat') {
                        btn.classList.add('text-cyan-600');
                        btn.classList.remove('text-slate-400');
                    } else if (id === 'loinhuan') {
                        btn.classList.add('text-emerald-600');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.add('text-indigo-600');
                        btn.classList.remove('text-slate-400');
                    }
                }
            });
        }

        // --- FETCH DATA ---
        async function fetchBaserowPages(tableId) {
            let results = [];
            let url = `https://api.baserow.io/api/database/rows/table/${tableId}/?user_field_names=true&size=200`;
            while (url) {
                try {
                    if (url.startsWith('http://')) {
                        url = url.replace('http://', 'https://');
                    }
                    const r = await fetch(url, { headers: { "Authorization": `Token ${BASEROW_TOKEN}` } });
                    
                    if (!r.ok) {
                        console.error(`Lỗi HTTP Baserow: ${r.status}`);
                        break;
                    }
                    
                    const data = await r.json();
                    if(data.results) results = results.concat(data.results);
                    url = data.next;
                } catch(e) { console.error("Lỗi fetch Baserow:", e); break; }
            }
            return results;
        }

        async function loadAllData() {
            // FIX: Dùng Try-Catch độc lập để Mua Giày - Giặt Giày - Lợi Nhuận không chờ đợi nhau hay kéo nhau chết.
            
            // 1. Tải Mua Giày
            fetchBaserowPages(TABLE_MUA).then(res => {
                dataMua = res;
                renderBaserowList('mua', dataMua);
            }).catch(e => console.log("Lỗi tải Mua Giày"));

            // 2. Tải Giặt Giày
            fetchBaserowPages(TABLE_GIAT).then(res => {
                dataGiat = res;
                renderBaserowList('giat', dataGiat);
            }).catch(e => console.log("Lỗi tải Giặt Giày"));

            // 3. Tải Lợi Nhuận (Firebase)
            const loadFirebaseData = async () => {
                if (window.fbDb) {
                    try {
                        const snap = await window.fbGetDocs(window.fbCollection(window.fbDb, "doanhthu"));
                        dataDoanhThu = [];
                        snap.forEach(docSnap => {
                            dataDoanhThu.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        dataDoanhThu.sort((a, b) => new Date(b.thoiGian) - new Date(a.thoiGian));
                        renderFirebaseList();
                    } catch (e) { console.error("Lỗi tải Firebase", e); }
                } else {
                    // Nếu thư viện Firebase chưa load xong, thử lại sau 500ms
                    setTimeout(loadFirebaseData, 500);
                }
            };
            loadFirebaseData();
        }

        // --- RENDER BASEROW (Mua & Giặt) ---
        function renderBaserowList(type, data) {
            const container = document.getElementById(`list-${type}`);
            container.innerHTML = "";
            
            let sortedData = [...data].sort((a, b) => new Date(b["Thời gian"] || 0) - new Date(a["Thời gian"] || 0));
            
            if(sortedData.length === 0) {
                container.innerHTML = `<div class="py-10 text-center text-slate-400 text-sm">Chưa có đơn hàng nào.</div>`;
                return;
            }

            sortedData.forEach(item => {
                const isMua = type === 'mua';
                const imgUrl = item["Ảnh giày"];
                const div = document.createElement('div');
                div.className = "bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm";
                
                let html = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="px-2 py-0.5 ${isMua?'bg-indigo-100 text-indigo-700':'bg-cyan-100 text-cyan-700'} font-extrabold text-[9px] rounded-md uppercase tracking-wider">${isMua?'Bán Giày':'Giặt Giày'}</span>
                            <div class="text-[10px] text-slate-400 font-bold mt-1">${formatDate(item["Thời gian"])}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-base font-black ${isMua?'text-indigo-600':'text-cyan-600'}">${isMua ? formatMoney(item["Giá tiền"]) : 'TT: ' + item["Trạng thái TT"]}</div>
                            <div class="text-xs font-bold text-slate-500 mt-0.5">${item["Hình thức TT"] || ''}</div>
                        </div>
                    </div>
                `;

                if (imgUrl) {
                    html += `
                    <div class="grid grid-cols-3 gap-3 items-stretch mt-3 border-t border-slate-100 pt-3">
                        <div class="col-span-2 flex flex-col justify-center overflow-hidden">
                            <div class="text-sm font-black text-slate-900 truncate">${isMua ? item["Tên giày"] : item["Dịch vụ"]}</div>
                            <div class="mt-1 text-xs font-bold text-slate-700 truncate"><i data-lucide="user" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i>${item["Tên khách"]}</div>
                            <div class="mt-0.5 text-[11px] font-semibold text-slate-500"><i data-lucide="phone" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i>${item["SĐT"]}</div>
                        </div>
                        <div class="relative aspect-square w-full rounded-xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm" onclick="openImageZoom('${imgUrl}')">
                            <img src="${imgUrl}" class="w-full h-full object-cover">
                        </div>
                    </div>`;
                } else {
                    html += `
                    <div class="mt-3 border-t border-slate-100 pt-3">
                        <div class="text-sm font-black text-slate-900 truncate">${isMua ? item["Tên giày"] : item["Dịch vụ"]}</div>
                        <div class="mt-1 text-xs font-bold text-slate-700 truncate"><i data-lucide="user" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i>${item["Tên khách"]}</div>
                        <div class="mt-0.5 text-[11px] font-semibold text-slate-500"><i data-lucide="phone" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i>${item["SĐT"]}</div>
                    </div>`;
                }

                div.innerHTML = html;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        // --- RENDER FIREBASE (Lợi Nhuận) - DẠNG LIST CHO MOBILE ---
        function renderFirebaseList() {
            const container = document.getElementById('list-loinhuan');
            container.innerHTML = "";
            
            let sumDoanhThu = 0;
            let sumGiaVon = 0;

            if (dataDoanhThu.length === 0) {
                container.innerHTML = `<div class="py-10 text-center text-slate-400 text-sm">Chưa có dữ liệu doanh thu.</div>`;
            } else {
                dataDoanhThu.forEach(item => {
                    const gb = Number(item.giaBan) || 0;
                    const gv = Number(item.giaVon) || 0;
                    const lai = gb - gv;
                    
                    sumDoanhThu += gb;
                    sumGiaVon += gv;

                    const div = document.createElement('div');
                    div.className = "bg-white border border-slate-100 rounded-xl p-3 shadow-sm";
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2 border-b border-slate-50 pb-2">
                            <div class="overflow-hidden pr-2">
                                <div class="font-bold text-slate-800 text-[13px] truncate leading-tight">${item.tenGiay}</div>
                                <div class="text-[10px] text-slate-400 mt-1">${formatDate(item.thoiGian)}</div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-[10px] text-slate-400 uppercase font-bold">Lãi</div>
                                <div class="text-sm font-black ${lai >= 0 ? 'text-emerald-600' : 'text-red-500'} mt-0.5">${formatMoney(lai)}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="flex-1">
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Giá Bán</label>
                                <div class="font-black text-indigo-600 text-sm">${formatMoney(gb)}</div>
                            </div>
                            <div class="flex-1">
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Giá Vốn (Nhập)</label>
                                <input type="number" value="${gv === 0 ? '' : gv}" placeholder="0" 
                                    onblur="updateGiaVonFirebase('${item.id}', this.value)" 
                                    class="w-full text-right px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-rose-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-inner">
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            // Update Stats
            document.getElementById('stat-doanhthu').innerText = formatMoney(sumDoanhThu);
            document.getElementById('stat-giavon').innerText = formatMoney(sumGiaVon);
            document.getElementById('stat-loinhuan').innerText = formatMoney(sumDoanhThu - sumGiaVon);
        }

        window.updateGiaVonFirebase = async function(id, valStr) {
            let val = parseInt(valStr) || 0;
            if (val > 0 && val < 10000) val = val * 1000;
            
            try {
                const docRef = window.fbDoc(window.fbDb, "doanhthu", id);
                await window.fbUpdateDoc(docRef, { giaVon: val });
                
                const idx = dataDoanhThu.findIndex(x => x.id === id);
                if(idx !== -1) dataDoanhThu[idx].giaVon = val;
                
                // Chỉ render lại cục bộ danh sách để không giật màn hình
                renderFirebaseList();
                showToast("Đã cập nhật giá vốn!", "success");
            } catch(e) {
                showToast("Lỗi cập nhật!", "danger");
                console.error(e);
            }
        }

        // --- AUTO CLEANUP ---
        window.cleanUpBaserow = async function() {
            if(!confirm("Hệ thống sẽ quét và xóa vĩnh viễn các Đơn Bán Giày quá 3 ngày trên Baserow. Bạn có chắc chắn?")) return;
            
            try {
                const now = new Date();
                const oldIds = dataMua.filter(item => {
                    if (!item["Thời gian"]) return true;
                    const diffTime = Math.abs(now - new Date(item["Thời gian"]));
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return diffDays > 3;
                }).map(item => item.id);

                if (oldIds.length === 0) {
                    showToast("Không có đơn rác nào cần dọn!", "info");
                    return;
                }

                showToast(`Đang xóa ${oldIds.length} đơn rác...`, "info");
                for (const id of oldIds) {
                    await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_MUA}/${id}/`, {
                        method: "DELETE",
                        headers: { "Authorization": `Token ${BASEROW_TOKEN}` }
                    });
                }
                showToast("Đã dọn dẹp Baserow thành công!", "success");
                await loadAllData(); 
            } catch (e) {
                showToast("Lỗi khi dọn rác!", "danger");
                console.error(e);
            }
        }

        // --- UTILS ---
        function formatMoney(amount) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount); }
        function formatDate(isoString) {
            if (!isoString) return ""; const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')} - ${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
        }
        function openImageZoom(url) {
            if(!url) return;
            document.getElementById('img-modal-content').src = url;
            document.getElementById('img-modal').classList.remove('hidden');
        }
        function closeImageZoom() { document.getElementById('img-modal').classList.add('hidden'); }
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = type === 'danger' ? "bg-red-500" : (type === 'info' ? "bg-blue-500" : "bg-emerald-500");
            toast.className = `${bgClass} text-white flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-sm font-semibold transform translate-y-[-10px] opacity-0 transition duration-300 mb-2`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-[-10px]', 'opacity-0'); }, 50);
            setTimeout(() => { toast.classList.add('translate-y-[-10px]', 'opacity-0'); setTimeout(() => { toast.remove(); }, 300); }, 3000); 
        }
    </script>
</body>
</html>
